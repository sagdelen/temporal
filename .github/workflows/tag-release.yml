name: Tag Release (Tests + Docker)

on:
  push:
    tags:
      - "v*-mongo.*"

permissions:
  contents: write
  actions: read

concurrency:
  group: tag-${{ github.ref }}
  cancel-in-progress: false

jobs:
  determine:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.determine.outputs.tag }}
      is_datetime: ${{ steps.determine.outputs.is_datetime }}
      is_stable: ${{ steps.determine.outputs.is_stable }}
    steps:
      - name: Determine tag
        id: determine
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" =~ ^v.*-mongo\.[0-9]+-[0-9]{8}T[0-9]{6}Z$ ]]; then
            IS_DATETIME=true
            IS_STABLE=false
          else
            IS_DATETIME=false
            IS_STABLE=true
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "is_datetime=$IS_DATETIME" >> "$GITHUB_OUTPUT"
          echo "is_stable=$IS_STABLE" >> "$GITHUB_OUTPUT"

  tests:
    needs: determine
    uses: ./.github/workflows/run-tests.yml
    with:
      ref: ${{ needs.determine.outputs.tag }}
      job_name_prefix: "tests / "
    secrets: inherit

  docker:
    needs: determine
    if: needs.determine.outputs.is_datetime == 'true'
    uses: ./.github/workflows/docker-build-push.yml
    with:
      tag: ${{ needs.determine.outputs.tag }}
    secrets: inherit

  release:
    needs: [determine, tests]
    if: needs.determine.outputs.is_stable == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.determine.outputs.tag }}
          release_name: ${{ needs.determine.outputs.tag }}
          draft: false
          prerelease: false
