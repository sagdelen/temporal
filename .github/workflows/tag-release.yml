name: Tag Release (Tests + Docker)

on:
  push:
    tags:
      - "v*-mongo.*"

permissions:
  contents: write
  actions: read

concurrency:
  group: tag-${{ github.ref }}
  cancel-in-progress: false

jobs:
  determine:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.determine.outputs.tag }}
      docker_tag: ${{ steps.determine.outputs.docker_tag }}
      skip_tests: ${{ steps.determine.outputs.skip_tests }}
      build_docker: ${{ steps.determine.outputs.build_docker }}
      is_stable: ${{ steps.determine.outputs.is_stable }}
    steps:
      - name: Determine tag
        id: determine
        run: |
          TAG="${GITHUB_REF_NAME}"
          DOCKER_TAG="$TAG"
          # Fast build: skip tests, docker only
          if [[ "$TAG" =~ -fast$ ]]; then
            SKIP_TESTS=true
            BUILD_DOCKER=true
            IS_STABLE=false
            # Remove -fast suffix from Docker tag
            DOCKER_TAG="${TAG%-fast}"
          # Datetime tag: tests + docker (parallel)
          elif [[ "$TAG" =~ ^v.*-mongo\.[0-9]+-[0-9]{8}T[0-9]{6}Z$ ]]; then
            SKIP_TESTS=false
            BUILD_DOCKER=true
            IS_STABLE=false
          # Stable tag: tests + docker + release
          else
            SKIP_TESTS=false
            BUILD_DOCKER=true
            IS_STABLE=true
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "docker_tag=$DOCKER_TAG" >> "$GITHUB_OUTPUT"
          echo "skip_tests=$SKIP_TESTS" >> "$GITHUB_OUTPUT"
          echo "build_docker=$BUILD_DOCKER" >> "$GITHUB_OUTPUT"
          echo "is_stable=$IS_STABLE" >> "$GITHUB_OUTPUT"

  tests:
    needs: determine
    if: needs.determine.outputs.skip_tests != 'true'
    uses: ./.github/workflows/run-tests.yml
    with:
      ref: ${{ needs.determine.outputs.tag }}
      job_name_prefix: "tests / "
    secrets: inherit

  docker:
    needs: determine
    if: needs.determine.outputs.build_docker == 'true'
    uses: ./.github/workflows/docker-build-push.yml
    with:
      tag: ${{ needs.determine.outputs.docker_tag }}
    secrets: inherit

  release:
    needs: [determine, tests]
    if: needs.determine.outputs.is_stable == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.determine.outputs.tag }}
          release_name: ${{ needs.determine.outputs.tag }}
          draft: false
          prerelease: false
